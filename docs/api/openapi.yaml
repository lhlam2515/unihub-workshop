      description: '**Authentication: HMAC signature, NOT JWT.** Each gateway has
        its own

        signing secret. The endpoint is naturally idempotent — gateways

        commonly retry.


        Only listed here for completeness; frontends do not call this.

        '
      operationId: paymentWebhook
      security:
      - webhookSignature: []
      parameters:
      - name: gateway
        in: path
        required: true
        schema:
          type: string
          enum:
          - VNPAY
          - STRIPE
          - MOMO
          - MOCK
      - name: X-Webhook-Signature
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Gateway-specific payload (opaque to OpenAPI)
      responses:
        '200':
          description: Webhook acknowledged
        '401':
          description: HMAC signature invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
