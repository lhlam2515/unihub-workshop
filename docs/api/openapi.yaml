  /checkins/sync:
    post:
      tags:
      - Check-in
      summary: Batch sync offline check-ins ⭐
      description: 'Mobile flushes its `checkin_queue` SQLite buffer to the server.

        Each item carries a `local_id` (UUID v4 generated on device) which

        serves as the per-item idempotency key.


        **No `Idempotency-Key` header** — each item has its own `local_id`.

        Same batch sent twice produces the same result via

        `ON CONFLICT DO NOTHING`.


        **Result classification per item:**

        - `SYNCED` — newly inserted on server

        - `CONFLICT` — registration already checked in (different device first)

        - `FAILED` — invalid `qr_code` or other validation failure


        The mobile app updates each row''s `sync_status` based on the matching

        result by `local_id` (not by index — server may reorder).

        '
      operationId: syncCheckins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinSyncRequest'
      responses:
        '200':
          description: Sync results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: '`checkin.batch_too_large` — items > 100 in one request.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
