  /payments:
    post:
      tags:
      - Payment
      summary: Create a payment ⭐
      description: "**Critical endpoint** — handles the most complex failure modes.\n\
        \n## Step ordering (invariant, `registration-paid.md` INV-03)\n\n1. Rate limit\
        \ check (T2, T3 — same tiers as `/registrations`).\n2. **Idempotency check\
        \ FIRST** (before Circuit Breaker) — if `payment_key`\n   has `status=completed`,\
        \ return cached response even when CB is OPEN.\n3. **Circuit Breaker check**\
        \ (per-gateway) — if OPEN, return 503 immediately\n   without claiming a new\
        \ key.\n4. Claim / refresh idempotency key (`in_progress`).\n5. Insert `payments`\
        \ record (`status=initiated`).\n6. Call gateway with timeout 5s, forwarding\
        \ `payment_key` as the gateway's\n   own `Idempotency-Key` header (prevents\
        \ double-charge).\n\n## `payment_key` — body field, not a header\n\nThe `payment_key`\
        \ is included **in the request body** (per `registration-paid.md`).\nThe client\
        \ must generate it once and **reuse the same key on every retry**.\nGenerating\
        \ a new key on retry bypasses the idempotency mechanism and risks\ndouble-charging.\
        \ On `504` the server embeds `payment_key` back in the error\nresponse as\
        \ a hint — client must use it verbatim.\n\n## Outcomes\n\n| Gateway result\
        \ | `payments.status` | `idempotency_keys.status` | HTTP |\n|---|---|---|---|\n\
        | 200 OK | `succeeded` | `completed` | `200` |\n| 402/4xx declined | `failed`\
        \ | `completed` | `402` |\n| 5xx (clear failure) | `failed` | `completed`\
        \ | `502` |\n| Timeout / unclear | `unresolved` | `unresolved` | `504` |\n\
        | CB OPEN | (no record) | (no record) | `503` |\n"
      operationId: createPayment
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
      responses:
        '200':
          description: Payment succeeded (or idempotent replay of a previous success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '402':
          description: '`payment.declined` — gateway returned a clear decline (insufficient

            funds, invalid card, etc.). Registration remains in `pending` state —

            student may retry with a corrected payment method using a **new** key.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`payment_in_progress` — `Idempotency-Key` is currently `in_progress`

            and `locked_until` has not expired. Back off and retry after

            `retry_after` seconds with the **same** key.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: '`PAYMENT_GATEWAY_OPEN` — Circuit Breaker is OPEN.

            Retry after `Retry-After` seconds. Non-payment features (browse, check-in)

            are unaffected.

            '
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: '`PAYMENT_TIMEOUT` — payment is `unresolved`. **Use the same
            `Idempotency-Key`

            on retry** — do NOT generate a new one. The reconciliation cron job (every

            5 min) will query the gateway for the actual outcome. If student retries

            before reconciliation, the server forwards the same key to the gateway

            which returns its cached result.

            '
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - type: object
                  properties:
                    idempotency_key:
                      type: string
                      format: uuid
                      description: Echo of the request Idempotency-Key header — reuse
                        on retry
                    retry_after:
                      type: integer
                      description: Suggested seconds to wait before retry (e.g. 30)
