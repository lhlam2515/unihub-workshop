  /registrations:
    post:
      tags:
      - Booking
      summary: Register for a workshop ⭐
      description: "**The most contention-sensitive endpoint.** Single endpoint for\
        \ both\nfree and paid workshops; the server branches internally on\n`workshop.price`.\n\
        \n## Idempotency (`registration-paid.md` §Bước 2)\n\nThe `Idempotency-Key`\
        \ **header** (UUID v4 generated by client) is\nrequired. Lifecycle (3-state,\
        \ ADR-08, ADR-15):\n\n| Server state | What client sees |\n|---|---|\n| `completed`\
        \ | Cached response replayed (idempotent) |\n| `in_progress` (locked) | `409\
        \ request_in_progress` |\n| none | Normal first-time processing |\n\n**Client\
        \ must generate the key once before the first attempt and reuse\nit on any\
        \ retry** — generating a new key on retry bypasses idempotency.\n\n## Rate\
        \ Limiting (`rate-limiting.md`)\n\nThis endpoint applies T2 (user: 30/60s)\
        \ **and** T3 (user×workshop: 5/60s).\nT1 (IP) does not apply — authenticated\
        \ users are identified by `user_id`.\nT3 is the critical guard: spam on one\
        \ workshop doesn't penalise registering\nfor a different workshop.\n\n## Free\
        \ workshop flow\n\n1. Rate limit check (T2, T3).\n2. Pre-check `seats_available`\
        \ via Redis cache (fail-fast, no DB round-trip).\n3. Claim idempotency key\
        \ (`in_progress`).\n4. OL retry loop (≤2 attempts, ADR-03):\n   - `INSERT\
        \ registration ON CONFLICT DO NOTHING`.\n   - If `rowsAffected=0` → student\
        \ already registered → return existing.\n   - `UPDATE workshops SET seats_available\
        \ -= 1, version += 1\n      WHERE id=? AND version=? AND seats_available >\
        \ 0`.\n   - On version mismatch → ROLLBACK and retry.\n5. Mark idempotency\
        \ `completed`.\n6. Invalidate cache key (fire-and-forget).\n7. Enqueue confirmation\
        \ notification via Redis Stream (async).\n8. Return `201` with `qr_code`.\n\
        \n## Paid workshop flow\n\nSame as free up to step 5, but `status='pending'`\
        \ and **no QR code**.\nThe response `next_step` directs the client to call\
        \ `POST /payments`.\n"
      operationId: createRegistration
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCreateRequest'
      responses:
        '201':
          description: Registration created (free) or seat reserved pending payment
            (paid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
              examples:
                free:
                  summary: Free workshop registration
                  value:
                    id: 550e8400-...
                    workshopId: 3f2a1c...
                    status: confirmed
                    qrCode: qr_abc123
                    registeredAt: '2026-05-12T08:30:15+07:00'
                    nextStep: null
                paid:
                  summary: Paid workshop — pending payment
                  value:
                    id: 550e8400-...
                    workshopId: 3f2a1c...
                    status: pending
                    qrCode: null
                    registeredAt: '2026-05-12T08:30:15+07:00'
                    nextStep:
                      action: create_payment
                      endpoint: /api/v1/payments
                      amount: 200000
                      currency: VND
                      expiresAt: '2026-05-12T08:45:15+07:00'
        '200':
          description: 'Idempotent replay — same `Idempotency-Key` header was used
            and a result

            already exists (`status=completed`). Body is the original `201` response.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          description: '`registration.workshop_not_open` — workshop is not in `status=''open''`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`request_in_progress` — the `Idempotency-Key` is currently
            locked

            (`status=in_progress`, `locked_until` not yet expired). Back off

            and retry after `retry_after` seconds with the **same** key.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'Multiple causes — check `error.type`:

            - `registration.workshop_full` — `seats_available = 0` after OL retries
            (or cache pre-check).

            - `registration.already_registered` — UNIQUE constraint hit (same student,
            same workshop).

            - `registration.student_not_in_csv` — `student_id` not in `students` table
            (ADR-12 known 24h gap).

            - `registration.conflict_exhausted` — OL retry ceiling (2 attempts) exhausted
            due to extreme contention.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
      - Booking
      summary: List my registrations
      description: 'Returns the authenticated student''s registrations. **Row-level
        filter:**

        `WHERE student_id = JWT.sub`. The endpoint does not accept a

        `student_id` query parameter — preventing peer data enumeration.

