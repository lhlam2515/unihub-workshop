  # ════════════════════════════════════════════════════════════════════════
  # ADMIN — F03 CONTENT & AI
  # ════════════════════════════════════════════════════════════════════════

  /admin/workshops/{workshop_id}/documents:
    post:
      tags: [Admin — Content & AI]
      summary: Upload tài liệu PDF — kích hoạt AI Pipeline
      operationId: adminUploadDocument
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
      description: |
        File được đẩy lên S3/MinIO — chỉ URL lưu vào DB, không lưu binary.
        Sau upload thành công, hệ thống **tự động** đẩy job vào Async Queue để kích hoạt
        AI Summary Pipeline (Pipe-and-Filter):
        1. Extract text từ PDF
        2. Clean & normalize
        3. Gọi LLM (claude-sonnet-4-6)
        4. Lưu `summary_text` vào `ai_summaries`
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File PDF, tối đa 50MB
      responses:
        '201':
          description: Upload thành công — AI Pipeline đang xử lý
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      document:
                        $ref: '#/components/schemas/WorkshopDocument'
                      ai_summary_queued:
                        type: boolean
                        example: true
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          description: Không phải file PDF
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    $ref: '#/components/schemas/ApiErrorShape'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'

    get:
      tags: [Admin — Content & AI]
      summary: Danh sách tài liệu của workshop
      operationId: adminListDocuments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
      responses:
        '200':
          description: Danh sách tài liệu
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkshopDocument'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

