  /checkin/scan:
    post:
      tags: [Check-in]
      summary: Quét QR Code (online)
      operationId: scanQR
      security:
        - BearerAuth: []
      description: |
        Lookup `qr_token` qua index `idx_tickets_qr_token` (hot query của hệ thống).
        
        Kết quả có thể:
        - **(a)** Ticket `ACTIVE` + chưa check-in → Tạo `checkin_records` (`source=ONLINE`) + `200 OK`
        - **(b)** Ticket `VOID` → `409 TICKET_VOID`
        - **(c)** Đã check-in → `409 TICKET_ALREADY_CHECKEDIN`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token, workshop_id]
              properties:
                qr_token:
                  type: string
                workshop_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Check-in thành công
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
