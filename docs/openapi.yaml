    delete:
      tags: [Admin — Content & AI]
      summary: Xóa tài liệu (cascade xóa AI Summary)
      operationId: adminDeleteDocument
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      description: Xóa record trong DB và file trên Object Storage. Cascade xóa `ai_summaries`.
