                      message: "This ticket has been voided"
                    meta:
                      requestId: "c5d6e7f8-0000-0000-0000-000000000000"
                      timestamp: "2026-04-27T10:30:00.000Z"
                      apiVersion: "v1"
                already_checked_in:
                  value:
                    success: false
                    error:
                      code: TICKET_ALREADY_CHECKEDIN
                      message: "This ticket has already been used for check-in"
                    meta:
                      requestId: "d6e7f8a9-0000-0000-0000-000000000000"
                      timestamp: "2026-04-27T10:30:00.000Z"
                      apiVersion: "v1"

  /checkin/sync:
    post:
      tags: [Check-in]
      summary: Đồng bộ dữ liệu check-in offline (batch, idempotent)
      operationId: syncOfflineCheckin
      security:
        - BearerAuth: []
      description: |
        Server thực thi:
        ```sql
        INSERT INTO checkin_records (...) ON CONFLICT (ticket_id, workshop_id) DO NOTHING
        ```
        Đảm bảo Mobile App có thể gọi nhiều lần mà không sinh bản ghi trùng.
        Cột `source` được set `OFFLINE_SYNC`. Ticket bị `VOID` trước khi sync → `sync_status = CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OfflineCheckinItem'
              minItems: 1
              maxItems: 1000
      responses:
        '200':
          description: Kết quả đồng bộ
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [synced, skipped, conflicts]
                    properties:
                      synced:
                        type: integer
                        description: Số bản ghi sync thành công
                      skipped:
                        type: integer
                        description: Số bản ghi bị bỏ qua (ON CONFLICT DO NOTHING)
                      conflicts:
                        type: array
                        items:
                          $ref: '#/components/schemas/SyncConflict'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

