                      apiVersion: "v1"

  /webhooks/payment/{gateway}:
    post:
      tags: [Payments]
      summary: Webhook callback từ Payment Gateway (HMAC auth)
      operationId: paymentWebhook
      security:
        - HmacSignature: []
      parameters:
        - $ref: '#/components/parameters/Gateway'
      description: |
        **Xác thực**: HMAC-SHA256 signature trong header `X-Gateway-Signature`, không dùng JWT.

        **Nếu SUCCESS** (1 ACID Transaction):
        - `Payment → SUCCESS`
        - `Registration → CONFIRMED`
        - `DEL seat:lock:{wid}:{reg_id}`
        - `confirmed_count++` trong `workshop_slots`
        - Phát Ticket
        - Đẩy event `PAYMENT_SUCCESS` vào Queue

        **Nếu FAILED**:
        - `Payment → FAILED`
        - `INCR seat:available:{wid}`
        - Đẩy event `PAYMENT_FAILED` vào Queue

        **Idempotency**: `SET NX idempotency:{key}` (Redis) + `UNIQUE(idempotency_key)` (PostgreSQL).
        Cập nhật Circuit Breaker state sau mỗi lần gọi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway_txn_id, status, idempotency_key]
              properties:
                gateway_txn_id:
                  type: string
                  description: ID giao dịch từ payment gateway
                status:
                  type: string
                  enum: [SUCCESS, FAILED]
                idempotency_key:
                  type: string
                raw_response:
                  type: object
                  additionalProperties: true
                  description: Toàn bộ response gốc từ gateway (để audit)
      responses:
        '200':
          description: Webhook xử lý thành công
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Webhook processed successfully"
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          description: HMAC signature không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    $ref: '#/components/schemas/ApiErrorShape'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'

