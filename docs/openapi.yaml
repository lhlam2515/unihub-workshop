      schema:
        $ref: '#/components/schemas/PaymentGateway'
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ════════════════════════════════════════════════════════════════════════
  # F01 — AUTH
  # ════════════════════════════════════════════════════════════════════════

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập — sinh Dual-Token
      operationId: authLogin
      description: |
        Xác thực credential và sinh cặp Access Token + Refresh Token.
        - **Web** (`platform=WEB`): Access Token (15 phút) trong body, Refresh Token (7 ngày) trong `HttpOnly Secure SameSite=Strict` Cookie.
        - **Mobile** (`platform=MOBILE`): Cả 2 trong body, Access Token hạn 8 giờ để phủ ca làm offline.
        Trả `401` với message chung (không tiết lộ field nào sai) để chống enumeration attack.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, platform]
              properties:
                email:
                  type: string
                  format: email
                  example: "student@university.edu.vn"
                password:
                  type: string
                  format: password
                  minLength: 8
                platform:
                  type: string
                  enum: [WEB, MOBILE]
      responses:
        '200':
          description: Đăng nhập thành công
          headers:
            Set-Cookie:
              description: |
                `refresh_token=<token>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth/refresh`
                (Chỉ set khi platform = WEB)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [access_token, expires_in, user]
                    properties:
                      access_token:
                        type: string
                        description: JWT Access Token
                      refresh_token:
                        type: string
                        description: Chỉ có khi platform = MOBILE (lưu vào Keychain)
                      expires_in:
                        type: integer
                        description: Thời hạn Access Token (giây) — 900 (WEB) hoặc 28800 (MOBILE)
                        example: 900
                      user:
                        $ref: '#/components/schemas/AuthMe'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Sai credential hoặc tài khoản bị SUSPENDED
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    $ref: '#/components/schemas/ApiErrorShape'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              examples:
                invalid_credentials:
                  value:
                    success: false
                    error:
                      code: INVALID_CREDENTIALS
                      message: "Email or password is incorrect"
                    meta:
                      requestId: "d4e5f6a7-0000-0000-0000-000000000000"
                      timestamp: "2026-04-27T10:30:00.000Z"
                      apiVersion: "v1"
                user_suspended:
                  value:
                    success: false
                    error:
                      code: USER_SUSPENDED
                      message: "Account has been suspended"
                    meta:
                      requestId: "e5f6a7b8-0000-0000-0000-000000000000"
                      timestamp: "2026-04-27T10:30:00.000Z"
                      apiVersion: "v1"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Silent Token Refresh — xoay vòng cặp token
      operationId: authRefresh
      description: |
        Nhận Refresh Token (Web: tự động từ Cookie; Mobile: từ body) và sinh cặp token mới.
        **Token Rotation**: Refresh Token cũ bị vô hiệu hóa, cặp mới được cấp.
        Frontend nên dùng **Mutex Lock** (`isRefreshing` flag) để tránh Thundering Herd
        khi nhiều request đồng thời nhận lỗi 401.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Chỉ cần khi platform = MOBILE (Web đọc từ Cookie tự động)
      responses:
        '200':
          description: Token được làm mới thành công
          headers:
            Set-Cookie:
              description: Refresh Token mới (chỉ Web)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [access_token, expires_in]
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                        description: Chỉ có khi Mobile
                      expires_in:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất — blacklist JTI hiện tại
      operationId: authLogout
      security:
        - BearerAuth: []
      description: |
        Ghi `token:blacklist:{jti}` vào Redis với TTL bằng thời gian còn lại của token.
        Web: Xóa HttpOnly Cookie. Mobile: Client tự xóa Keychain.
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Logged out successfully"
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Lấy thông tin profile đang đăng nhập
      operationId: authGetMe
      security:
        - BearerAuth: []
      description: |
        Trả về thông tin user từ `jwt.sub`. Response tùy theo role:
        - `STUDENT`: thêm `student_code`, `full_name`, `faculty`
        - `CHECKIN_STAFF`: thêm `allowed_workshop_ids`
      responses:
        '200':
          description: Profile người dùng
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/AuthMe'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ════════════════════════════════════════════════════════════════════════
  # F02 — WORKSHOPS (PUBLIC)
  # ════════════════════════════════════════════════════════════════════════

  /workshops:
    get:
      tags: [Workshops (Public)]
      summary: Danh sách workshop công khai
      operationId: listWorkshops
      description: |
        Chỉ trả workshop `status = PUBLISHED`. `available_seats` đọc từ Redis
        `seat:available:{workshop_id}` — real-time, không phải PostgreSQL.
      parameters:
        - name: faculty
          in: query
          schema:
            type: string
          description: Lọc theo khoa
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: is_paid
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách workshop
          content:
            application/json:
              schema:
                type: object
                required: [success, data, pagination, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkshopSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'

  /workshops/{workshop_id}:
    get:
      tags: [Workshops (Public)]
      summary: Chi tiết workshop công khai
      operationId: getWorkshop
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
      description: |
        Trả đầy đủ: Workshop, Speaker, Room (kèm `floor_plan_url`), AI Summary (nếu DONE).
        `available_seats` đọc từ Redis. Trả `404` nếu không phải `PUBLISHED`.
      responses:
        '200':
          description: Chi tiết workshop
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/WorkshopDetail'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════════════════════════════════
  # F04 — REGISTRATIONS
  # ════════════════════════════════════════════════════════════════════════

  /registrations:
    post:
      tags: [Registrations]
      summary: Đăng ký workshop (critical path — 12.000 CCU)
      operationId: createRegistration
      security:
        - BearerAuth: []
      description: |
        **Luồng xử lý tuần tự (thứ tự bắt buộc):**

        1. **Token Bucket** (`ratelimit:register:{user_id}` trên Redis) → `429` nếu hết token  
        2. **DECR** `seat:available:{workshop_id}` (Redis atomic) → `409 SEAT_UNAVAILABLE` nếu kết quả < 0  
        3. **UNIQUE check** `(student_id, workshop_id)` trên PostgreSQL → `409 REGISTRATION_DUPLICATE`  
        4a. **Miễn phí**: INSERT Registration `CONFIRMED` + phát Ticket ngay (1 transaction)  
        4b. **Có phí**: INSERT Registration `PENDING_PAYMENT` + `SET seat:lock TTL=900s` + sinh `idempotency_key`  

        Bước 1 & 2 hoàn toàn trên Redis (< 1ms), loại 99% request trước khi chạm PostgreSQL.
        Tại DB dùng `SELECT...FOR UPDATE` với `Lock Wait Timeout = 3s` (Fail-Fast).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workshop_id]
              properties:
                workshop_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/Registration'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              examples:
                free_workshop:
                  summary: Workshop miễn phí — CONFIRMED ngay
                  value:
                    success: true
                    data:
                      registration_id: "uuid-xxx"
                      student_id: "uuid-yyy"
                      workshop_id: "uuid-zzz"
                      status: CONFIRMED
                      registered_at: "2026-04-27T10:30:00.000Z"
                      confirmed_at: "2026-04-27T10:30:00.000Z"
                    meta:
                      requestId: "f6a7b8c9-0000-0000-0000-000000000000"
                      timestamp: "2026-04-27T10:30:00.000Z"
                      apiVersion: "v1"
                paid_workshop:
                  summary: Workshop có phí — chờ thanh toán
                  value:
                    success: true
                    data:
                      registration_id: "uuid-xxx"
                      student_id: "uuid-yyy"
                      workshop_id: "uuid-zzz"
                      status: PENDING_PAYMENT
                      registered_at: "2026-04-27T10:30:00.000Z"
                      payment_deadline: "2026-04-27T10:45:00.000Z"
                      amount: 150000
                    meta:
                      requestId: "a7b8c9d0-0000-0000-0000-000000000000"
                      timestamp: "2026-04-27T10:30:00.000Z"
                      apiVersion: "v1"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Hết chỗ hoặc đã đăng ký
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    $ref: '#/components/schemas/ApiErrorShape'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              examples:
                seat_unavailable:
                  value:
                    success: false
                    error:
                      code: SEAT_UNAVAILABLE
                      message: "Workshop is fully booked"
                    meta:
                      requestId: "b8c9d0e1-0000-0000-0000-000000000000"
                      timestamp: "2026-04-27T10:30:00.000Z"
                      apiVersion: "v1"
                already_registered:
                  value:
                    success: false
                    error:
                      code: REGISTRATION_DUPLICATE
                      message: "You have already registered for this workshop"
                    meta:
                      requestId: "c9d0e1f2-0000-0000-0000-000000000000"
                      timestamp: "2026-04-27T10:30:00.000Z"
                      apiVersion: "v1"
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /students/me/registrations:
    get:
      tags: [Registrations]
      summary: Lịch sử đăng ký của sinh viên
      operationId: listMyRegistrations
      security:
        - BearerAuth: []
      description: |
        **IDOR Protection**: SQL luôn bao gồm `WHERE student_id = jwt.sub` —
        backend tự inject, bỏ qua mọi tham số ID do client gửi.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RegistrationStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách đăng ký
          content:
            application/json:
              schema:
                type: object
                required: [success, data, pagination, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/RegistrationWithDetails'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /students/me/registrations/{registration_id}:
    get:
      tags: [Registrations]
      summary: Chi tiết một đơn đăng ký
      operationId: getMyRegistration
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: Chi tiết đơn
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/RegistrationWithDetails'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /registrations/{registration_id}:
    delete:
      tags: [Registrations]
      summary: Hủy đăng ký
      operationId: cancelRegistration
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      description: |
        **IDOR Protection**: Nếu `registration.student_id ≠ jwt.sub` → trả `404` (không phải `403`)
        để không lộ sự tồn tại của tài nguyên.

        **Cascade khi hủy:**
        - `INCR seat:available:{workshop_id}` (Redis)
        - `DEL seat:lock:{workshop_id}:{registration_id}` (Redis)
        - Ticket → `VOID`
        - Đẩy event `REGISTRATION_CANCELLED` vào Message Queue
      responses:
        '200':
          description: Hủy thành công
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Registration cancelled successfully"
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════════════════════════════════
  # F05 — PAYMENTS
  # ════════════════════════════════════════════════════════════════════════

  /payments:
    post:
      tags: [Payments]
      summary: Khởi tạo giao dịch thanh toán
      operationId: createPayment
      security:
        - BearerAuth: []
      description: |
        **Idempotency**: Header `X-Idempotency-Key` bắt buộc. Client phải dùng lại
        cùng key khi retry để tránh double-charge.

        **Luồng xử lý:**
        1. Kiểm tra SeatLock còn TTL → `409 SEAT_LOCK_EXPIRED` nếu hết 15 phút
        2. Layer 1 Idempotency: `SET NX idempotency:{key} EX 86400` → trả kết quả cũ nếu đã tồn tại
        3. Kiểm tra Circuit Breaker `circuit:payment:{gateway}` → `503` nếu `OPEN`
        4. INSERT `payments` với `SELECT...FOR UPDATE` (Lock Wait Timeout 3s)
        5. Gọi Payment Gateway, trả về redirect URL
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          description: UUID duy nhất cho ý định thanh toán này. Dùng lại khi retry.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_id, gateway]
              properties:
                registration_id:
                  type: string
                  format: uuid
                gateway:
                  $ref: '#/components/schemas/PaymentGateway'
      responses:
        '201':
          description: Giao dịch khởi tạo thành công
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [payment_id, redirect_url, payment_deadline]
                    properties:
                      payment_id:
                        type: string
                        format: uuid
                      redirect_url:
                        type: string
                        format: uri
                        description: URL thanh toán tại cổng payment (redirect client đến đây)
                      payment_deadline:
                        type: string
                        format: date-time
                        description: Thời hạn thanh toán (bằng SeatLock TTL)
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: SeatLock hết hạn hoặc payment trùng lặp
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    $ref: '#/components/schemas/ApiErrorShape'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              examples:
                seat_lock_expired:
