        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════════════════════════════════
  # ADMIN — F09 STUDENT SYNC
  # ════════════════════════════════════════════════════════════════════════

  /admin/student-sync:
    post:
      tags: [Admin — Student Sync]
      summary: Kích hoạt CSV Import Job (async — trả 202 ngay)
      operationId: adminTriggerStudentSync
      security:
        - BearerAuth: []
      description: |
        Tạo `student_sync_jobs` với `status = RUNNING`. **Trả `202 Accepted` ngay** — job chạy
        bất đồng bộ ngầm (Batch-Sequential). Poll endpoint `GET /admin/student-sync/{job_id}` để theo dõi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_file_name]
              properties:
                source_file_name:
                  type: string
                  description: Đường dẫn file CSV trong S3/MinIO
                  example: "student-data/2026-04-27/students.csv"
      responses:
        '202':
          description: Job đã được tạo và đang chạy nền
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [job_id]
                    properties:
                      job_id:
                        type: string
                        format: uuid
                      message:
                        type: string
                        example: "Import job started. Poll /admin/student-sync/{job_id} for progress."
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      tags: [Admin — Student Sync]
      summary: Lịch sử các lần sync
      operationId: adminListSyncJobs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách sync jobs
          content:
            application/json:
              schema:
                type: object
                required: [success, data, pagination, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/StudentSyncJob'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/student-sync/{job_id}:
    get:
      tags: [Admin — Student Sync]
      summary: Chi tiết tiến trình Sync
      operationId: adminGetSyncJob
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      description: Organizer poll endpoint này để theo dõi tiến độ import.
      responses:
        '200':
          description: Tiến trình sync
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/StudentSyncJob'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/student-sync/{job_id}/errors:
    get:
      tags: [Admin — Student Sync]
      summary: Danh sách dòng CSV lỗi
      operationId: adminGetSyncErrors
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      description: Trả chi tiết dòng lỗi để Organizer debug và fix CSV.
      responses:
        '200':
          description: Danh sách lỗi
          content:
            application/json:
              schema:
                type: object
                required: [success, data, pagination, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/StudentSyncError'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════════════════════════════════
  # ADMIN — F10 SYSTEM & STAFF MANAGEMENT
  # ════════════════════════════════════════════════════════════════════════

  /admin/checkin-staff/{user_id}/assign-workshops:
    post:
      tags: [Admin — System]
      summary: Phân công Workshop cho Check-in Staff
      operationId: adminAssignWorkshops
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      description: |
        **Tính Eventual Consistency**: Thay đổi chỉ có hiệu lực ở JWT tiếp theo sau khi
        nhân sự logout/login lại. Response bao gồm warning về điều này.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workshop_ids]
              properties:
                workshop_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Danh sách workshop_id được phân công
      responses:
        '200':
          description: Phân công thành công (với Eventual Consistency warning)
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      assigned_workshop_ids:
                        type: array
                        items:
                          type: string
                          format: uuid
                      warning:
                        type: string
                        example: "Nhân sự cần đăng xuất và đăng nhập lại để nhận quyền mới"
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/checkin-staff/{user_id}/workshops:
    get:
      tags: [Admin — System]
      summary: Danh sách Workshop được phân công cho nhân sự
      operationId: adminGetStaffWorkshops
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Danh sách workshop phân công
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkshopSummary'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/system/jobs/payment-timeout:
    get:
      tags: [Admin — System]
      summary: Giám sát Payment Timeout Job
      operationId: adminGetPaymentTimeoutJob
      security:
        - BearerAuth: []
      description: Job tự chạy mỗi 1 phút bởi Cron — endpoint này chỉ để giám sát.
      responses:
        '200':
          description: Trạng thái Payment Timeout Job
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [pending_overdue_count, last_run_at]
                    properties:
                      pending_overdue_count:
                        type: integer
                        description: Số payment PENDING quá hạn hiện tại
                      last_run_at:
                        type: string
                        format: date-time
                        nullable: true
                      processed_last_24h:
                        type: integer
                        description: Số bản ghi đã xử lý trong 24h qua
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/system/jobs/reconciliation:
    get:
      tags: [Admin — System]
      summary: Giám sát Reconciliation Job (Redis ↔ PostgreSQL)
      operationId: adminGetReconciliationJob
      security:
        - BearerAuth: []
      description: |
        Trạng thái đồng bộ giữa Redis counter `seat:available:{wid}` và
        PostgreSQL `workshop_slots`. Job tự chạy mỗi 10 phút.
      responses:
        '200':
          description: Trạng thái reconciliation
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [last_run_at, drift_detected]
                    properties:
                      last_run_at:
                        type: string
                        format: date-time
                        nullable: true
                      drift_detected:
                        type: boolean
                        description: Có độ lệch giữa Redis và PostgreSQL không
                      drift_details:
                        type: array
                        items:
                          type: object
                          properties:
                            workshop_id:
                              type: string
                              format: uuid
                            redis_available:
                              type: integer
                            postgres_available:
                              type: integer
                            delta:
                              type: integer
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/system/circuit-breaker:
    get:
      tags: [Admin — System]
      summary: Trạng thái Circuit Breaker của tất cả Payment Gateway
      operationId: adminGetCircuitBreakers
      security:
        - BearerAuth: []
      description: |
        Đọc Redis Hash `circuit:payment:{gateway}` cho tất cả gateway.
        Thresholds: `CLOSED → OPEN` khi `failure_count >= 5` trong 60s;
        `OPEN → HALF_OPEN` sau 30s; `HALF_OPEN → CLOSED` sau 1 success call.
      responses:
        '200':
          description: Trạng thái circuit breakers
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/CircuitBreakerStatus'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/system/circuit-breaker/{gateway}/reset:
    post:
      tags: [Admin — System]
      summary: Reset Circuit Breaker thủ công về CLOSED
      operationId: adminResetCircuitBreaker
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Gateway'
      description: |
        Force chuyển state về `CLOSED`, `failure_count = 0`.
        Dùng khi đã xác nhận cổng thanh toán đã phục hồi nhưng Canary Request
        chưa tự trigger được.
      responses:
        '200':
          description: Circuit Breaker đã được reset
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/CircuitBreakerStatus'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
