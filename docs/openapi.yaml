                    enum: [true]
                  data:
                    type: object
                    required: [student_name, student_code, checked_in_at]
                    properties:
                      student_name:
                        type: string
                      student_code:
                        type: string
                      checked_in_at:
                        type: string
                        format: date-time
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Vé không hợp lệ hoặc đã check-in
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    $ref: '#/components/schemas/ApiErrorShape'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              examples:
                ticket_void:
