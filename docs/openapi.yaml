openapi: 3.1.0

info:
  title: UniHub Workshop API
  version: "1.0"
  description: |
    RESTful API cho hệ thống UniHub Workshop — quản lý đăng ký workshop, thanh toán,
    check-in, AI Summary, và đồng bộ dữ liệu sinh viên.

    ## Kiến trúc bảo mật
    - **Dual-Token**: Access Token (JWT) + Refresh Token (HttpOnly Cookie / Keychain)
    - **IDOR Protection**: Các endpoint `/students/me/*` tự inject `student_id` từ JWT
    - **Idempotency**: Header `X-Idempotency-Key` bắt buộc cho endpoint thanh toán
    - **HMAC**: Webhook từ Payment Gateway xác thực bằng chữ ký HMAC thay vì JWT

    ## Cấu trúc response
    Mọi response đều bọc trong `ApiResponse<T>` envelope:
    - `success: true` → `data` luôn có
    - `success: false` → `error` luôn có (code + message + fieldErrors?)
    - `meta.requestId` luôn có để trace log

servers:
  - url: /api/v1
    description: Production

tags:
  - name: Auth
    description: Xác thực danh tính & quản lý token (F01)
  - name: Workshops (Public)
    description: Danh sách & chi tiết workshop công khai (F02 — STUDENT view)
  - name: Registrations
    description: Đăng ký workshop & hủy đăng ký (F04)
  - name: Payments
    description: Thanh toán & callback webhook (F05)
  - name: Tickets
    description: Vé điện tử & QR Code của sinh viên (F06)
  - name: Check-in
    description: Quét QR, đồng bộ offline, trạng thái check-in (F07)
  - name: Admin — Users
    description: Quản lý người dùng & thu hồi token (F01 Admin)
  - name: Admin — Workshops
    description: CRUD workshop, publish, cancel, thống kê (F02 Admin)
  - name: Admin — Content & AI
    description: Upload PDF, kích hoạt AI Summary pipeline (F03)
  - name: Admin — Notifications
    description: Audit log thông báo & cấu hình kênh (F08)
  - name: Admin — Student Sync
    description: Import CSV sinh viên theo Batch-Sequential (F09)
  - name: Admin — System
    description: Phân công nhân sự, giám sát jobs, circuit breaker (F10)

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY SCHEMES
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access Token JWT. Thời hạn: 15 phút (Web) hoặc 8 giờ (Mobile).
        Payload chứa: `sub` (user_id), `role`, `allowed_workshop_ids?` (CHECKIN_STAFF).
    HmacSignature:
      type: apiKey
      in: header
      name: X-Gateway-Signature
      description: |
        HMAC-SHA256 signature từ Payment Gateway. Backend xác thực bằng shared secret.
        Không dùng JWT cho webhook endpoint.

  # ─────────────────────────────────────────────────────────────────────────
  # SHARED SCHEMAS — ERROR & RESPONSE ENVELOPE (từ types.ts)
  # ─────────────────────────────────────────────────────────────────────────
  schemas:

    # ── Meta ──────────────────────────────────────────────────────────────
    RequestMeta:
      type: object
      required: [requestId, timestamp, apiVersion]
      properties:
        requestId:
          type: string
          format: uuid
          description: UUID v4 của request — dùng để correlate log
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp khi server xử lý xong
          example: "2026-04-27T10:30:00.000Z"
        apiVersion:
          type: string
          example: "v1"
        processingMs:
          type: integer
          description: Thời gian xử lý (milliseconds)
          example: 42

    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages, hasNextPage, hasPrevPage]
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8
        hasNextPage:
          type: boolean
          example: true
        hasPrevPage:
          type: boolean
          example: false

    FieldError:
      type: object
      required: [field, rule, message]
      properties:
        field:
          type: string
          description: Tên field, hỗ trợ dot-notation
          example: "payment.amount"
        rule:
          type: string
          description: Mã lỗi validation của field
          example: "min"
        message:
          type: string
          example: "Amount phải lớn hơn 0"
        received:
          description: Giá trị thực tế client gửi lên (không log PII)
          example: -500

    ApiErrorShape:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Thông điệp kỹ thuật tiếng Anh — không hiển thị trực tiếp cho user
          example: "Workshop has no available seats"
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Chỉ có khi code = VALIDATION_FAILED

    ErrorCode:
      type: string
      enum:
        # Registration & Seat
        - SEAT_UNAVAILABLE
        - SEAT_LOCK_EXPIRED
        - REGISTRATION_DUPLICATE
        - REGISTRATION_NOT_FOUND
        - REGISTRATION_CANCELLED
        # Payment
        - PAYMENT_DUPLICATE
        - PAYMENT_GATEWAY_ERROR
        - PAYMENT_GATEWAY_OPEN
        - PAYMENT_TIMEOUT
        - PAYMENT_NOT_FOUND
        - PAYMENT_ALREADY_SUCCESS
        # Workshop
        - WORKSHOP_NOT_FOUND
        - WORKSHOP_NOT_PUBLISHED
        - WORKSHOP_CANCELLED
        - WORKSHOP_FULL
        - WORKSHOP_TIME_CONFLICT
        # Ticket & Check-in
        - TICKET_NOT_FOUND
        - TICKET_VOID
        - TICKET_ALREADY_CHECKEDIN
        - CHECKIN_SCOPE_DENIED
        # Auth & Identity
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - TOKEN_REVOKED
        - REFRESH_TOKEN_INVALID
        - USER_NOT_FOUND
        - USER_SUSPENDED
        - STUDENT_NOT_FOUND
        - INVALID_CREDENTIALS
        # System
        - RATE_LIMIT_EXCEEDED
        - DB_LOCK_TIMEOUT
        - VALIDATION_FAILED
        - INTERNAL_ERROR

    # ── Generic Success/Error Envelope helpers ─────────────────────────────
    # Vì OpenAPI 3.1 không hỗ trợ generic trực tiếp, ta dùng
    # x-success-data để document từng endpoint cụ thể bên dưới.

    # ── Enums từ schema.sql ────────────────────────────────────────────────
    UserRole:
      type: string
      enum: [STUDENT, ORGANIZER, CHECKIN_STAFF]

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, PENDING_VERIFICATION]

    WorkshopStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED]

    RegistrationStatus:
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED, WAITLISTED]

    TicketStatus:
      type: string
      enum: [ACTIVE, VOID]

    PaymentStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED, REFUNDED, TIMEOUT]

    PaymentGateway:
      type: string
      enum: [VNPAY, STRIPE, MOMO, MOCK]

    NotificationType:
      type: string
      enum:
        - REGISTRATION_CONFIRMED
        - REGISTRATION_CANCELLED
        - WORKSHOP_UPDATED
        - WORKSHOP_CANCELLED
        - PAYMENT_SUCCESS
        - PAYMENT_FAILED
        - CHECKIN_REMINDER

    NotificationChannel:
      type: string
      enum: [APP, EMAIL, TELEGRAM]

    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED]

    CheckinSource:
      type: string
      enum: [ONLINE, OFFLINE_SYNC]

    SyncJobStatus:
      type: string
      enum: [RUNNING, SUCCESS, PARTIAL_FAILURE, FAILED]

    SyncErrorReason:
      type: string
      enum: [DUPLICATE, INVALID_FORMAT, MISSING_FIELD, UNKNOWN]

    AiSummaryStatus:
      type: string
      enum: [PENDING, PROCESSING, DONE, FAILED]

    CircuitBreakerState:
      type: string
      enum: [CLOSED, OPEN, HALF_OPEN]

    # ── Domain Entities ────────────────────────────────────────────────────

    User:
      type: object
      required: [user_id, email, role, status, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: "student@university.edu.vn"
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          type: string
          format: date-time

    StudentProfile:
      type: object
      required: [student_id, student_code, full_name]
      properties:
        student_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
          description: NULL nếu chưa có account UniHub
        student_code:
          type: string
          example: "SV2021001"
        full_name:
          type: string
          example: "Nguyễn Văn An"
        faculty:
          type: string
          example: "Công nghệ Thông tin"
        class_year:
          type: integer
          example: 2021
        email_edu:
          type: string
          format: email
          example: "an.nv@university.edu.vn"

    AuthMe:
      type: object
      required: [user_id, email, role]
      description: Profile của user đang đăng nhập
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        # STUDENT fields
        student_code:
          type: string
          description: Chỉ có khi role = STUDENT
        full_name:
          type: string
          description: Chỉ có khi role = STUDENT
        faculty:
          type: string
          description: Chỉ có khi role = STUDENT
        # CHECKIN_STAFF fields
        allowed_workshop_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Chỉ có khi role = CHECKIN_STAFF

    Speaker:
      type: object
      required: [speaker_id, full_name]
      properties:
        speaker_id:
          type: string
          format: uuid
        full_name:
          type: string
          example: "Trần Thị Bình"
        title:
          type: string
          example: "CTO tại TechCorp"
        bio:
          type: string
        avatar_url:
          type: string
          format: uri

    Room:
      type: object
      required: [room_id, name, capacity]
      properties:
        room_id:
          type: string
          format: uuid
        name:
          type: string
          example: "Phòng B2-01"
        building:
          type: string
        floor:
          type: integer
        capacity:
          type: integer
          minimum: 1
        floor_plan_url:
          type: string
          format: uri
          description: URL sơ đồ phòng trên Object Storage
        facilities:
          type: object
          additionalProperties: true
          example: {projector: true, ac: true, mic: 2}

    WorkshopSummary:
      type: object
      description: Workshop rút gọn — dùng trong danh sách
      required: [workshop_id, title, speaker, room, starts_at, ends_at, capacity, is_paid, status, available_seats]
      properties:
        workshop_id:
          type: string
          format: uuid
        title:
          type: string
          example: "Clean Architecture trong thực tế"
        speaker:
          $ref: '#/components/schemas/Speaker'
        room:
          $ref: '#/components/schemas/Room'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1
        is_paid:
          type: boolean
        price:
          type: number
          format: double
          nullable: true
          description: NULL nếu is_paid = false
          example: 150000
        status:
          $ref: '#/components/schemas/WorkshopStatus'
        available_seats:
          type: integer
          description: Đọc từ Redis `seat:available:{workshop_id}` — real-time
          example: 34

    WorkshopDetail:
      allOf:
        - $ref: '#/components/schemas/WorkshopSummary'
        - type: object
          properties:
            description:
              type: string
            ai_summary:
              $ref: '#/components/schemas/AiSummaryPublic'
              nullable: true
              description: Chỉ trả nếu status = DONE

    WorkshopAdminDetail:
      allOf:
        - $ref: '#/components/schemas/WorkshopDetail'
        - type: object
          description: Thêm trường quản trị không expose cho STUDENT
          properties:
            confirmed_count:
              type: integer
              description: Số đăng ký đã xác nhận (từ workshop_slots)
            locked_count:
              type: integer
              description: Số ghế đang giữ chờ thanh toán (từ workshop_slots)
            created_by:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time

    AiSummaryPublic:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AiSummaryStatus'
        summary_text:
          type: string
          nullable: true
          description: Nội dung tóm tắt AI — chỉ có khi status = DONE
        model_used:
          type: string
          example: "claude-sonnet-4-6"
        generated_at:
          type: string
          format: date-time
          nullable: true

    AiSummaryAdmin:
      allOf:
        - $ref: '#/components/schemas/AiSummaryPublic'
        - type: object
          properties:
            summary_id:
              type: string
              format: uuid
            document_id:
              type: string
              format: uuid
            error_message:
              type: string
              nullable: true

    Registration:
      type: object
      required: [registration_id, student_id, workshop_id, status, registered_at]
      properties:
        registration_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        workshop_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RegistrationStatus'
        registered_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancellation_reason:
          type: string
          nullable: true
        payment_deadline:
          type: string
          format: date-time
          nullable: true
          description: Thời điểm SeatLock hết hạn (Redis TTL 15 phút) — chỉ có khi status = PENDING_PAYMENT
        amount:
          type: number
          format: double
          nullable: true
          description: Số tiền cần thanh toán — chỉ có khi is_paid = true

    RegistrationWithDetails:
      allOf:
        - $ref: '#/components/schemas/Registration'
        - type: object
          properties:
            workshop:
              $ref: '#/components/schemas/WorkshopSummary'
            ticket:
              $ref: '#/components/schemas/Ticket'
              nullable: true
              description: Chỉ có khi status = CONFIRMED
            payment:
              $ref: '#/components/schemas/Payment'
              nullable: true

    Ticket:
      type: object
      required: [ticket_id, registration_id, qr_token, status, issued_at]
      properties:
        ticket_id:
          type: string
          format: uuid
        registration_id:
          type: string
          format: uuid
        qr_token:
          type: string
          description: Signed JWT/UUID — client render thành QR Code
        status:
          $ref: '#/components/schemas/TicketStatus'
        issued_at:
          type: string
          format: date-time
        voided_at:
          type: string
          format: date-time
          nullable: true

    TicketWithWorkshop:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          properties:
            workshop:
              type: object
              required: [workshop_id, title, starts_at, room]
              properties:
                workshop_id:
                  type: string
                  format: uuid
                title:
                  type: string
                starts_at:
                  type: string
                  format: date-time
                room:
                  type: object
                  properties:
                    name:
                      type: string
                    building:
                      type: string

    Payment:
      type: object
      required: [payment_id, registration_id, student_id, amount, currency, gateway, status, initiated_at]
      properties:
        payment_id:
          type: string
          format: uuid
        registration_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 150000
        currency:
          type: string
          default: VND
          example: VND
        gateway:
          $ref: '#/components/schemas/PaymentGateway'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        idempotency_key:
          type: string
          description: Mã giao dịch nội bộ — backend sinh ra
        gateway_txn_id:
          type: string
          nullable: true
          description: ID từ phía payment gateway (sau khi gọi thành công)
        initiated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        timeout_at:
          type: string
          format: date-time
          nullable: true

    WorkshopDocument:
      type: object
      required: [document_id, workshop_id, file_url, upload_status, uploaded_at]
      properties:
        document_id:
          type: string
          format: uuid
        workshop_id:
          type: string
          format: uuid
        file_url:
          type: string
          format: uri
          description: URL trỏ tới Object Storage (S3/MinIO)
        original_name:
          type: string
          example: "tailieu_workshop.pdf"
        file_size_bytes:
          type: integer
          format: int64
        upload_status:
          type: string
          enum: [UPLOADED, PROCESSING, PROCESSED, FAILED]
        uploaded_at:
          type: string
          format: date-time

    NotificationLog:
      type: object
      required: [notification_id, user_id, type, channel, status, created_at]
      properties:
        notification_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        workshop_id:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/NotificationType'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        status:
          $ref: '#/components/schemas/NotificationStatus'
        payload:
          type: object
          additionalProperties: true
          description: Nội dung đã gửi
        sent_at:
          type: string
          format: date-time
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    NotificationChannelConfig:
      type: object
      required: [channel_type, is_active]
      properties:
        channel_type:
          $ref: '#/components/schemas/NotificationChannel'
        is_active:
          type: boolean
        config_json:
          type: object
          additionalProperties: true
          description: Endpoint, API key pattern, template ID (externalized config)

    StudentSyncJob:
      type: object
      required: [job_id, triggered_at, source_file_name, status]
      properties:
        job_id:
          type: string
          format: uuid
        triggered_at:
          type: string
          format: date-time
        source_file_name:
          type: string
        status:
          $ref: '#/components/schemas/SyncJobStatus'
        total_rows:
          type: integer
          nullable: true
        processed_rows:
          type: integer
          nullable: true
        error_rows:
          type: integer
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        error_log_url:
          type: string
          format: uri
          nullable: true

    StudentSyncError:
      type: object
      required: [error_id, job_id, row_number, raw_data, error_reason]
      properties:
        error_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        row_number:
          type: integer
        raw_data:
          type: string
          description: Nội dung dòng CSV lỗi
        error_reason:
          $ref: '#/components/schemas/SyncErrorReason'
        error_detail:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CircuitBreakerStatus:
      type: object
      required: [gateway, state, failure_count]
      properties:
        gateway:
          $ref: '#/components/schemas/PaymentGateway'
        state:
          $ref: '#/components/schemas/CircuitBreakerState'
        failure_count:
          type: integer
          description: Số lần fail liên tiếp
        opened_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp khi chuyển sang OPEN
        last_attempt:
          type: string
          format: date-time
          nullable: true

    WorkshopCheckinStats:
      type: object
      required: [workshop_id, title, total_registered, total_checkedin, checkin_rate_pct]
      properties:
        workshop_id:
          type: string
          format: uuid
        title:
          type: string
        total_registered:
          type: integer
        total_checkedin:
          type: integer
        offline_checkins:
          type: integer
        checkin_rate_pct:
          type: number
          format: double
          description: Tỷ lệ tham dự (%)
          example: 87.50

    OfflineCheckinItem:
      type: object
      required: [local_id, qr_token, workshop_id, checked_in_at, device_id, checked_in_by]
      properties:
        local_id:
          type: string
          format: uuid
          description: UUID sinh trên device
        qr_token:
          type: string
        workshop_id:
          type: string
          format: uuid
        checked_in_at:
          type: string
          format: date-time
          description: Thời điểm check-in thực tế (offline)
        device_id:
          type: string
        checked_in_by:
          type: string
          format: uuid
          description: user_id của nhân sự check-in

    SyncConflict:
      type: object
      required: [local_id, reason]
      properties:
        local_id:
          type: string
          format: uuid
        reason:
          type: string
          example: "TICKET_VOID"

  # ── Reusable Response Bodies ─────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Token không hợp lệ, hết hạn hoặc bị thu hồi
      content:
        application/json:
          schema:
            type: object
            required: [success, error, meta]
            properties:
              success:
                type: boolean
                enum: [false]
              error:
                $ref: '#/components/schemas/ApiErrorShape'
              meta:
                $ref: '#/components/schemas/RequestMeta'
          examples:
            token_expired:
              value:
                success: false
                error:
                  code: TOKEN_EXPIRED
                  message: "Access token has expired"
                meta:
                  requestId: "a1b2c3d4-0000-0000-0000-000000000000"
                  timestamp: "2026-04-27T10:30:00.000Z"
                  apiVersion: "v1"
            token_revoked:
              value:
                success: false
                error:
                  code: TOKEN_REVOKED
                  message: "Token has been revoked"
                meta:
                  requestId: "b2c3d4e5-0000-0000-0000-000000000000"
                  timestamp: "2026-04-27T10:30:00.000Z"
                  apiVersion: "v1"

    Forbidden:
      description: Không đủ quyền hạn (sai Role hoặc ngoài scope)
      content:
        application/json:
          schema:
            type: object
            required: [success, error, meta]
            properties:
              success:
                type: boolean
                enum: [false]
              error:
                $ref: '#/components/schemas/ApiErrorShape'
              meta:
                $ref: '#/components/schemas/RequestMeta'

    NotFound:
      description: Tài nguyên không tồn tại
      content:
        application/json:
          schema:
            type: object
            required: [success, error, meta]
            properties:
              success:
                type: boolean
                enum: [false]
              error:
                $ref: '#/components/schemas/ApiErrorShape'
              meta:
                $ref: '#/components/schemas/RequestMeta'

    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ (400)
      content:
        application/json:
          schema:
            type: object
            required: [success, error, meta]
            properties:
              success:
                type: boolean
                enum: [false]
              error:
                allOf:
                  - $ref: '#/components/schemas/ApiErrorShape'
                  - type: object
                    properties:
                      fieldErrors:
                        type: array
                        items:
                          $ref: '#/components/schemas/FieldError'
              meta:
                $ref: '#/components/schemas/RequestMeta'

    RateLimitExceeded:
      description: Token Bucket hết token — 429
      headers:
        Retry-After:
          description: Số giây cần chờ trước khi thử lại
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            required: [success, error, meta]
            properties:
              success:
                type: boolean
                enum: [false]
              error:
                $ref: '#/components/schemas/ApiErrorShape'
              meta:
                $ref: '#/components/schemas/RequestMeta'
          example:
            success: false
            error:
              code: RATE_LIMIT_EXCEEDED
              message: "Too many requests. Please try again in a few seconds."
            meta:
              requestId: "c3d4e5f6-0000-0000-0000-000000000000"
              timestamp: "2026-04-27T10:30:00.000Z"
              apiVersion: "v1"

    ServiceUnavailable:
      description: DB lock timeout hoặc Circuit Breaker OPEN — 503
      content:
        application/json:
          schema:
            type: object
            required: [success, error, meta]
            properties:
              success:
                type: boolean
                enum: [false]
              error:
                $ref: '#/components/schemas/ApiErrorShape'
              meta:
                $ref: '#/components/schemas/RequestMeta'

  # ── Reusable Parameters ──────────────────────────────────────────────────
  parameters:
    WorkshopId:
      name: workshop_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registration_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelType:
      name: channel_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NotificationChannel'
    Gateway:
      name: gateway
      in: path
