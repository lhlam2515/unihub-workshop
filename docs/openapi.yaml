        - $ref: '#/components/parameters/WorkshopId'
      responses:
        '200':
          description: Chi tiết workshop
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/WorkshopAdminDetail'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Admin — Workshops]
      summary: Cập nhật workshop (chỉ khi DRAFT)
      operationId: adminUpdateWorkshop
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
      description: |
        Chỉ cho phép khi `status = DRAFT`. Kiểm tra xung đột phòng nếu
        `room_id` hoặc `starts_at`/`ends_at` thay đổi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                speaker_id:
                  type: string
                  format: uuid
                room_id:
                  type: string
                  format: uuid
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                  minimum: 1
                is_paid:
                  type: boolean
                price:
                  type: number
                  format: double
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/WorkshopAdminDetail'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Xung đột phòng hoặc sai trạng thái
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    $ref: '#/components/schemas/ApiErrorShape'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              example:
                success: false
                error:
                  code: WORKSHOP_TIME_CONFLICT
                  message: "Room is already booked for this time slot"
                meta:
                  requestId: "e7f8a9b0-0000-0000-0000-000000000000"
                  timestamp: "2026-04-27T10:30:00.000Z"
                  apiVersion: "v1"

  /admin/workshops/{workshop_id}/publish:
    post:
      tags: [Admin — Workshops]
      summary: Publish workshop (DRAFT → PUBLISHED + khởi tạo Redis counter)
      operationId: adminPublishWorkshop
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
      description: |
        **Side effect quan trọng**: `SET seat:available:{workshop_id} {capacity}` trên Redis.
        Chỉ chạy 1 lần. Workshop xuất hiện trong danh sách công khai ngay sau khi publish.
      responses:
        '200':
          description: Publish thành công
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/WorkshopAdminDetail'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Không thể publish từ trạng thái hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    $ref: '#/components/schemas/ApiErrorShape'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              example:
                success: false
                error:
                  code: WORKSHOP_CANCELLED
                  message: "Cannot publish a cancelled workshop"
                meta:
                  requestId: "f8a9b0c1-0000-0000-0000-000000000000"
                  timestamp: "2026-04-27T10:30:00.000Z"
                  apiVersion: "v1"

  /admin/workshops/{workshop_id}/emergency-update:
    patch:
      tags: [Admin — Workshops]
      summary: Đổi phòng / giờ khẩn cấp (Workshop đã PUBLISHED)
      operationId: adminEmergencyUpdate
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
      description: |
        Cập nhật `room_id`/`starts_at`/`ends_at` cho workshop đang PUBLISHED.
        **Không** đụng Redis counter. Kiểm tra xung đột phòng trước.
        **API trả `200 OK` ngay** (< 300ms) — thông báo cho sinh viên gửi bất đồng bộ qua Queue.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                room_id:
                  type: string
                  format: uuid
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Cập nhật thành công — thông báo đang được gửi bất đồng bộ
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      workshop:
                        $ref: '#/components/schemas/WorkshopAdminDetail'
                      notification_queued:
                        type: boolean
                        example: true
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Xung đột phòng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    $ref: '#/components/schemas/ApiErrorShape'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'

  /admin/workshops/{workshop_id}/cancel:
    post:
      tags: [Admin — Workshops]
      summary: Hủy workshop
      operationId: adminCancelWorkshop
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
      description: |
        **Cascade:**
        - VOID toàn bộ Ticket ACTIVE
        - CANCEL toàn bộ Registration CONFIRMED/PENDING_PAYMENT
        - Đẩy event `WORKSHOP_CANCELLED` vào Queue
        - `DEL seat:available:{workshop_id}` trên Redis
      responses:
        '200':
          description: Hủy thành công
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      voided_tickets:
                        type: integer
                      cancelled_registrations:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Workshop đã ở trạng thái CANCELLED
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [false]
                  error:
                    $ref: '#/components/schemas/ApiErrorShape'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'

