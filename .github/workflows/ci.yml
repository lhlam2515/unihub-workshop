name: CI

# Baseline quality gate. This is the lane that blocks a merge; mutation testing
# is a separate, non-blocking lane (see mutation.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo caches task output between runs keyed on file hashes.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.ref_name }}-
            turbo-main-

      # Lint is not here on purpose. It fails on all three workspaces on main
      # (server 71 errors, mobile 20, web 3) and runs in the quarantine job below.
      - name: Type check
        run: pnpm check-types

      # Unit specs live next to the source under apps/server/src.
      # 651 tests, no Postgres/Redis/Docker needed - every dependency is mocked.
      - name: Unit tests with coverage
        run: pnpm test:cov

      - name: Build
        run: pnpm build

      - name: Coverage summary
        if: always()
        run: |
          F=apps/server/coverage/coverage-summary.json
          if [ ! -f "$F" ]; then
            echo "No coverage summary produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const t = require("./apps/server/coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log("## Coverage\n");
            console.log("| Metric | % | Covered |");
            console.log("|---|---:|---:|");
            ["lines","statements","branches","functions"].forEach(k => console.log(row(k)));
            console.log("\nCoverage measures execution, not assertion strength. See the mutation testing lane for that.");
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: apps/server/coverage/
          retention-days: 14

  # Quarantine lane.
  #
  # Measured on 2026-08-03 against HEAD of main, before this pipeline existed:
  #   lint server    477 problems, 71 errors
  #   lint mobile    29 problems,  20 errors (18 are prettier formatting)
  #   lint web       10 problems,   3 errors
  #   integration    58 of 114 tests failing (4 of 6 suites)
  #   e2e            68 of 83  tests failing (5 of 7 suites)
  #
  # None of this was caused by adding CI - the integration config had no npm
  # script calling it, so nothing had ever run it, and lint had never run in CI
  # at all. Enforcing any of it today turns main red on the first commit, which
  # teaches everyone to ignore a red build. Reported, not enforced. Promote a
  # check into `verify` above the moment it goes green.
  quarantine:
    name: Known failing checks (not enforced)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (server)
        id: lint_server
        continue-on-error: true
        run: pnpm exec turbo run lint --filter=server

      - name: Lint (web)
        id: lint_web
        continue-on-error: true
        run: pnpm exec turbo run lint --filter=web

      - name: Lint (mobile)
        id: lint_mobile
        continue-on-error: true
        run: pnpm exec turbo run lint --filter=mobile

      - name: Integration tests
        id: integration
        continue-on-error: true
        run: pnpm test:integration

      - name: E2E tests
        id: e2e
        continue-on-error: true
        run: pnpm test:e2e

      - name: Report status
        if: always()
        run: |
          {
            echo "## Quarantined checks"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint server | ${{ steps.lint_server.outcome }} |"
            echo "| Lint web | ${{ steps.lint_web.outcome }} |"
            echo "| Lint mobile | ${{ steps.lint_mobile.outcome }} |"
            echo "| Integration | ${{ steps.integration.outcome }} |"
            echo "| E2E | ${{ steps.e2e.outcome }} |"
            echo ""
            echo "These do not block merges. Fix one, then move it into the \`verify\` job."
          } >> "$GITHUB_STEP_SUMMARY"
